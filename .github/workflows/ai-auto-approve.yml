name: AI auto-approve

# Satisfies the branch-protection "1 required approving review" gate with an
# AUTOMATED approval instead of a mandatory human one, per the SOC 2
# "Application changes reviewed" control (Vanta).
#
# WHO DOES WHAT
#   • codex / claude are the REVIEWERS — they read the diff and surface
#     findings. This workflow does not review code.
#   • The "DJAI Auto Approve Bot" GitHub App is the APPROVER identity — it has
#     no judgment; it just submits a formal APPROVE so the gate is satisfied
#     without a human. Its installation token's review counts toward the
#     required-approval count (a default GITHUB_TOKEN review would not).
#   • THIS workflow is the brain: it reads codex/claude output and decides.
#
# APPROVAL RULE (maintainer-set)
#   APPROVE the head commit when BOTH hold:
#     • codex reviewed THIS head and flagged NO P1, AND
#     • claude did not explicitly block.
#   A human approval is always an accepted alternative. This workflow only ever
#   ADDS an approval — it never requests changes or merges. If codex hasn't
#   reviewed yet, or anything is ambiguous, it does NOTHING (PR stays blocked
#   for a human) — approval is the deliberate exception, never the default.
#
# DRY RUN
#   DRY_RUN='true' (current) → log "WOULD approve / WOULD NOT approve: <reason>"
#   and never actually approve. Validate the decisions against real PRs, then
#   set DRY_RUN='false' to enable approvals.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-auto-approve-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI_APPROVE_APP_ID }}
          private-key: ${{ secrets.AI_APPROVE_APP_PRIVATE_KEY }}

      - name: Evaluate AI reviews and approve if clean
        env:
          # All gh calls (reads + the approve) run as the App so the approval counts.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Live: submits real approvals. Set back to 'true' to return to log-only.
          DRY_RUN: 'false'
          APP_SLUG: djai-auto-approve-bot
          # codex stamps findings with a severity badge; P1 = blocking.
          CODEX_P1_REGEX: 'P1 Badge|/badge/P1|severity:[[:space:]]*P1'
          # Explicit claude block signals (review state handled separately). Anchored
          # to the "Verdict:" token + unambiguous phrases — NOT bare words like
          # "blocking", which false-match prose such as "Observations (non-blocking)".
          CLAUDE_BLOCK_REGEX: 'do not merge|verdict:[[:space:]*]*(request|needs|block|reject|hold|do not|major|change)'
          # claude positive verdict — counts as a sign-off (e.g. "**Verdict: LGTM.**").
          CLAUDE_PASS_REGEX: '\bLGTM\b|looks good to me|good to merge|ship it|verdict:[[:space:]*]*(lgtm|approv|looks good|good to merge|ship)'
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number || github.event.issue.number }}"
          BOT="${APP_SLUG}[bot]"

          decide() { echo "::notice::ai-auto-approve PR#$PR — $1"; }
          skip()   { decide "WOULD NOT approve: $1"; exit 0; }

          # Collect everything a reviewer posted on this PR from ALL three
          # surfaces: issue (conversation) comments, inline review comments, and
          # review SUMMARY bodies. codex puts its "Reviewed commit" stamp and
          # severity badges in different ones depending on the post (e.g. the
          # stamp lands in the review summary body, not a conversation comment),
          # so reading only one surface misses it. $1 = jq author-select expr.
          bodies() {
            { gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select($1) | .body"
              gh api "repos/$REPO/pulls/$PR/comments"  --paginate --jq ".[] | select($1) | .body"
              gh api "repos/$REPO/pulls/$PR/reviews"   --paginate --jq ".[] | select($1) | .body"; } 2>/dev/null || true
          }

          read -r HEAD_SHA IS_DRAFT < <(
            gh pr view "$PR" --repo "$REPO" --json headRefOid,isDraft \
              --jq '"\(.headRefOid) \(.isDraft)"'
          )
          SHORT="${HEAD_SHA:0:10}"
          echo "head=$HEAD_SHA draft=$IS_DRAFT dry_run=$DRY_RUN"
          [ "$IS_DRAFT" = "true" ] && skip "draft PR"

          CODEX="$(bodies '.user.login=="chatgpt-codex-connector[bot]"')"
          CLAUDE="$(bodies '.user.login | test("^claude")')"

          # ---- hard blocks: either reviewer can veto ----
          if grep -qiE "$CODEX_P1_REGEX" <<<"$CODEX"; then
            skip "codex flagged a P1"
          fi
          if gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
               --jq '.[] | select(.user.login | test("^claude")) | .state' 2>/dev/null \
               | grep -q 'CHANGES_REQUESTED'; then
            skip "claude requested changes"
          fi
          if grep -qiE "$CLAUDE_BLOCK_REGEX" <<<"$CLAUDE"; then
            skip "claude explicitly blocked in a comment"
          fi

          # ---- positive sign-off: need at least ONE reviewer to have approved ----
          # codex: stamps "**Reviewed commit:** `<sha>`" for the head it reviewed
          #        (allow markdown **, spaces, backticks between label and sha).
          # claude: an explicit positive verdict (LGTM / looks good / approve).
          # NOTE: codex's signal is head-bound; claude's verdict is not (it posts in
          # a conversation comment with no commit id), so a claude LGTM from before a
          # later push still counts — acceptable per maintainer call; tighten later
          # if needed.
          REASON=""
          if grep -qiE "Reviewed commit:[^[:alnum:]]*(${HEAD_SHA}|${SHORT})" <<<"$CODEX"; then
            REASON="codex reviewed head $SHORT, no P1"
          elif grep -qiE "$CLAUDE_PASS_REGEX" <<<"$CLAUDE"; then
            REASON="claude gave a positive verdict (LGTM); no blocking review"
          else
            skip "no sign-off on this head — codex hasn't reviewed it and no claude LGTM"
          fi

          # ---- already approved by the App for this head? ----
          if gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
               --jq ".[] | select(.user.login==\"$BOT\" and .commit_id==\"$HEAD_SHA\" and .state==\"APPROVED\") | .id" \
               | grep -q .; then
            decide "already approved $SHORT — nothing to do"; exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            decide "WOULD approve $SHORT — $REASON"
            exit 0
          fi
          decide "approving $SHORT — $REASON"
          gh pr review "$PR" --repo "$REPO" --approve \
            --body "✅ Auto-approved: $REASON. (AI auto-approve — SOC 2 change-review control.)"
